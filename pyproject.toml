[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.1.0"
description = "Explainable, cross-dataset, adversarially tested network intrusion detection on flow features."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Iheb Mabrouki"}]
keywords = ["intrusion detection", "machine learning", "network security", "CIC-IDS2017", "numpy"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "shap>=0.45",
    "mlflow>=2.12",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "joblib>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dl = ["torch>=2.2"]
adv = ["adversarial-robustness-toolbox>=1.17"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "streamlit>=1.33", "cicflowmeter>=0.1.9"]
dev = ["pytest>=8", "ruff>=0.4", "jupyterlab>=4"]
all = ["flowguard[serve,dev]"]   # our models are pure NumPy: PyTorch and ART are optional extras

[project.urls]
Repository = "https://github.com/ihebmabroukii/flowguard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
